name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  gitleaks:
    name: Secret Detection Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test-push:
    name: Build, Test and Push Image
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            -t node-registry:latest \
            .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pyyaml

      - name: Start stack with Docker Compose
        env:
          API_IMAGE: node-registry:latest
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 120

      - name: Test API health endpoint
        run: curl -sSf http://localhost:8080/health

      - name: Run tests (pytest)
        run: pytest tests/ -v --tb=short

      - name: Stop stack and collect logs
        if: always()
        run: |
          docker compose logs --tail=50
          docker compose down -v

      - name: Log in and push image to ghcr.io
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag node-registry:latest "$IMAGE_NAME:${{ github.sha }}"
          docker tag node-registry:latest "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          docker logout ghcr.io
